# Initial Options ##############################################################
set-option -g terminal-overrides ",*:RGB"
set-option -g update-environment "DISPLAY SSH_AUTH_SOCK VIRTUAL_ENV PATH"
set-option -g mouse on
set-window-option -g mode-keys vi
set-window-option -g pane-base-index 1
set-environment -g VIRTUAL_ENV $VIRTUAL_ENV
set-option -g detach-on-destroy off

# Display Config ###############################################################
set-option -g status-bg '#3377ff'
set-option -g status-fg '#ffffff'
set-option -g status-left "  #{session_name} "
set-option -g status-left-style "bg=#071040,fg=#ffffff"
set-option -g status-left-length 15
set-option -g status-right-length 60
set-option -g status-right "#[bg=#3377ff,fg=#112baa]#[fg=#ffffff,bg=#112baa]   %A, %B %d, %Y #[bg=#112baa,fg=#0d1c66]#[bg=#0d1c66,fg=#ffffff]  %I:%M:%S %P #[bg=#0d1c66,fg=#071040]#[bg=#071040,fg=#ffffff]  %Z "
set-option -g status-interval 1
set-option -g base-index 1
set-option -g escape-time 1 # need some delay for Windows Terminal Ubuntu 20.04
set-option -g display-time 2000
set-option -g message-style "bg=#081f4d,fg=#ffffff,fill=#081f4d"
set-option -g pane-border-style "fg=#505050"
set-option -g pane-active-border-style "fg=#4080ff"
set-window-option -g pane-border-indicators off # colour the whole shared border when there are two panes
set-option -g pane-border-format "#[align=right]#{?pane_active,#[bg=#4080ff],#[bg=#505050]}#[fg=#ffffff]#{pane_index}: #{pane_current_command}#[default]"
set-option -g renumber-windows
set-option -g window-status-format "#{?#{==:#I,1},#[fg=#071040],#[fg=#3377ff]}#[bg=#3377ff,fg=#ffffff] #I:#W "
set-option -g window-status-current-format "#{?#{==:#I,1},,#[bg=#80aaff#,fg=#3377ff]}#[bg=#80aaff,fg=#071040] #I:#W#[bg=#3377ff,fg=#80aaff]"
set-option -g automatic-rename on
# set-option -g automatic-rename-format " #{=/-20/...:#(realpath #{pane_current_path} | sed \"s:`realpath ~`:~:\" | rev | cut -d'/' -f-3 | rev)}  #{pane_current_command}"
set-option -g automatic-rename-format " #{=/-20/…:#(~/.tmux/shorten.sh `realpath #{pane_current_path}`)}  #{pane_current_command}"
set-window-option -g window-status-current-style "bg=#80aaff,fg=#071040"
set-window-option -g window-status-separator ''

set-option -g focus-events on
set-hook -g pane-focus-in "set-option -gFw pane-border-status \"#{?#{e|>:#{window_panes},1},top,off}\""
set-hook -g pane-focus-in "set-option -gFw pane-border-status \"#{?#{e|>:#{window_panes},1},top,off}\""
set-hook -g window-unlinked "move-window -r"

# Command Aliases ##############################################################

# Maps #########################################################################
set-option -g repeat-time 0

# rebind prefix
unbind C-b
set-option -g prefix M-a
bind M-a send-prefix

# root table binds
bind-key -n M-\; command-prompt
bind-key -n 'M-"' show-messages
bind-key -n M-? list-keys
bind-key -n M-[ copy-mode
bind-key -n M-] paste
bind-key -n M-z resize-pane -Z

# source this config file (for easy adjustments without quitting tmux)
bind -n M-R "source-file ~/.tmux.conf\; display 'Reloaded ~/.tmux.conf'"

# Vim copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "$HOME/.local/bin/clip"
bind-key -T copy-mode-vi c-v \
  send-keys -X rectangle-toggle \; send-keys -X begin-selection
bind-key -T copy-mode-vi d send-keys -X halfpage-down
bind-key -T copy-mode-vi u send-keys -X halfpage-up
bind-key -T copy-mode-vi z switch-client -T copy-mode-vi-z
bind-key -T copy-mode-vi-z z send-keys -X scroll-middle
bind-key -T copy-mode-vi-z t send-keys -X scroll-top
bind-key -T copy-mode-vi-z b send-keys -X scroll-bottom


# # Sessions # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# new session
bind -n M-N command-prompt -I 'new-session -s '
# rename this session
bind -n M-r command-prompt -I 'rename-session '
# switch sessions
bind -n M-s run-shell "~/.tmux/session-menu.sh '#S'"
# cycle through sessions
bind-key -n M-) switch-client -n
bind-key -n M-( switch-client -p
# kill session
bind-key -n M-K confirm -p "Kill session '#S'? (y/n)" kill-session

# go to sessions by number
bind-key -n M-! run-shell "~/.tmux/switch-session.sh 1 '#{client_name}'"
bind-key -n M-@ run-shell "~/.tmux/switch-session.sh 2 '#{client_name}'"
bind-key -n M-# run-shell "~/.tmux/switch-session.sh 3 '#{client_name}'"
bind-key -n M-$ run-shell "~/.tmux/switch-session.sh 4 '#{client_name}'"
bind-key -n M-% run-shell "~/.tmux/switch-session.sh 5 '#{client_name}'"
bind-key -n M-^ run-shell "~/.tmux/switch-session.sh 6 '#{client_name}'"
bind-key -n M-& run-shell "~/.tmux/switch-session.sh 7 '#{client_name}'"
bind-key -n M-* run-shell "~/.tmux/switch-session.sh 8 '#{client_name}'"

# # Windows # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# new window
bind-key -n M-n new-window -c '#{pane_current_path}'

# go to windows by number
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8

# next and previous windows
bind -n M-, select-window -t -1
bind -n M-. select-window -t +1

# move windows left and right
bind -n M-< swap-window -t -1 \; previous-window
bind -n M-> swap-window -t +1 \; next-window

# kill window
bind-key -n M-X confirm-before -p "kill-window? (y/n)" kill-window

# # Panes # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# split vertically
bind-key -n M-\- split-window -v -c "#{pane_current_path}"
# even vertical
bind-key -n M-| select-layout even-horizontal

# split horizontally
bind-key -n M-\\ split-window -h -c "#{pane_current_path}"
# even horizontal
bind-key -n M-_ select-layout even-vertical

# navigate left
bind-key -n M-h select-pane -L
# navigate right
bind-key -n M-l select-pane -R
# navigate up
bind-key -n M-k select-pane -U
# navigate down
bind-key -n M-j select-pane -D

# resize panges
bind -n M-Left  resize-pane -L 1
bind -n M-Down  resize-pane -D 1
bind -n M-Up    resize-pane -U 1
bind -n M-Right resize-pane -R 1

# swap pane with previous
bind-key -n M-\{ swap-pane -D
# swap pane with next
bind-key -n M-\} swap-pane -U

# kill pane
bind-key -n M-x confirm-before -p "kill-pane? (y/n)" kill-pane

# # Pane Presets # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# ┏━┳━┓
# ┃ ┣━┫ 3 grid of panes
# ┗━┻━┛
bind-key '3' source ~/.tmux/threePane
# ┏━┳━┓
# ┣━╋━┫ 4 grid of panes
# ┗━┻━┛
bind-key '4' source ~/.tmux/fourPane

# kill all panes but current
bind-key -n M-o "kill-pane -a; set-option pane-border-status"


# tmux 3.5+ ####################################################################
# kitty isn't in tmux's built-in terminal list, so declare what it supports
# (reset first so each reload doesn't append another copy)
set-option -su terminal-features
set-option -as terminal-features 'xterm-kitty:hyperlinks'

# floating pane in the current directory
bind-key -n M-f new-pane -c "#{pane_current_path}"

# wheel scrolls full-screen apps that don't use the mouse (less, man) with arrow
# keys instead of doing nothing
bind-key -n WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
  { send-keys -M } \
  { if-shell -F "#{alternate_on}" { send-keys -N 3 Up } { copy-mode -e } }
bind-key -n WheelDownPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
  { send-keys -M } \
  { if-shell -F "#{alternate_on}" { send-keys -N 3 Down } }

# jump between shell prompts in copy mode (needs oh-my-posh shell_integration)
bind-key -T copy-mode-vi [ send-keys -X previous-prompt
bind-key -T copy-mode-vi ] send-keys -X next-prompt
