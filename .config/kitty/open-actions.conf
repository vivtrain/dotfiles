# file:///tmux/<session>:<window>.<pane> links (from Claude's relay skill) jump to that tmux pane
protocol file
url ^file:///tmux/
action launch --type=background ~/.claude/skills/relay/goto-pane.sh ${URL}

# file:///copy/<percent-encoded text> links copy the text to the clipboard (and tmux buffer)
protocol file
url ^file:///copy/
action launch --type=background ~/.config/kitty/copy-text.sh ${URL}
