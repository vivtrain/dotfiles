# Stop on the last frame of every video (no auto-advance, no quitting)
keep-open=always

# Reserve a strip below the video so the control bar doesn't cover it
video-margin-ratio-bottom=0.06

# OSC: thin bar docked at the bottom; don't scale it with the video's resolution
script-opts=osc-layout=bottombar,osc-vidscale=no,osc-scalewindowed=1.0,osc-seekbarkeyframes=no,osc-visibility=always

# Exact seeks everywhere (arrow keys, seekbar) instead of snapping to keyframes
hr-seek=yes
