# Stop on the last frame of every video (no auto-advance, no quitting)
keep-open=always

# OSC: thin bar docked at the bottom; don't scale it with the video's resolution.
# boxvideo shrinks the video to sit above the whole bar (both rows), recomputed on every resize.
script-opts=osc-layout=bottombar,osc-vidscale=no,osc-scalewindowed=1.0,osc-seekbarkeyframes=no,osc-visibility=always,osc-boxvideo=yes

# Exact seeks everywhere (arrow keys, seekbar) instead of snapping to keyframes
hr-seek=yes

# No OSD bar/message on seeks: the always-visible OSC seekbar already shows the position
osd-on-seek=no

# Idle instead of exiting when the playlist runs out; scripts/stay-open.lua then returns to the last
# video that played (the run-out only happens when a queued file fails to load). Esc still quits.
idle=yes
