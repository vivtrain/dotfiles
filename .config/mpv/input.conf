# Left click on the video toggles pause (right click still does too)
MBTN_LEFT cycle pause

# Esc closes the player (default only leaves fullscreen)
ESC quit

# Vim-style: h/l seek -/+5s, j/k next/previous video in the playlist (folder via autoload)
h seek -5 exact
l seek 5 exact
j playlist-next
k playlist-prev

# Ctrl+O: open the current file's folder in Nautilus with the file selected
ctrl+o run nautilus --select "${path}"

# Playback speed: < / > step -/+0.25x (replaces default playlist prev/next; use j/k for that).
# Default [ ] fine-step keys unbound; { } (halve/double) and Backspace (reset) still work.
< add speed -0.25
> add speed 0.25
[ ignore
] ignore
