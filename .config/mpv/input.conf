# Left click on the video toggles pause (right click still does too)
MBTN_LEFT cycle pause

# Esc closes the player (default only leaves fullscreen)
ESC quit

# Vim-style: h/l seek -/+5s, j/k next/previous video in the playlist (folder via autoload)
h seek -5 exact
l seek 5 exact
j playlist-next
k playlist-prev
